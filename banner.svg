<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="240" rx="16" fill="url(#bg)"/>

  <!-- soft decorative waves -->
  <path d="M0 190 Q 250 140 500 190 T 1000 190 L1000 240 L0 240 Z" fill="#ffffff" opacity="0.05">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 190 Q 250 140 500 190 T 1000 190 L1000 240 L0 240 Z;
              M0 190 Q 250 230 500 190 T 1000 190 L1000 240 L0 240 Z;
              M0 190 Q 250 140 500 190 T 1000 190 L1000 240 L0 240 Z"/>
  </path>
  <path d="M0 205 Q 250 170 500 205 T 1000 205 L1000 240 L0 240 Z" fill="#00d4ff" opacity="0.08">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0 205 Q 250 170 500 205 T 1000 205 L1000 240 L0 240 Z;
              M0 205 Q 250 235 500 205 T 1000 205 L1000 240 L0 240 Z;
              M0 205 Q 250 170 500 205 T 1000 205 L1000 240 L0 240 Z"/>
  </path>

  <!-- name -->
  <text x="500" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" fill="#ffffff" letter-spacing="2">
    VIKRAM MALI
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- accent line -->
  <rect x="400" y="122" width="200" height="4" rx="2" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="500" y="165" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="22" fill="#cfefff">
    CSE Undergrad  •  AI &amp; Data Enthusiast  •  Python Developer
    <animate attributeName="opacity" from="0" to="1" dur="2s" fill="freeze"/>
  </text>
</svg>
